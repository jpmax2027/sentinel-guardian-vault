[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200
remappings = ["@reactive/=lib/reactive-lib/"]

fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
lasna = "https://lasna-rpc.rnk.dev/"

